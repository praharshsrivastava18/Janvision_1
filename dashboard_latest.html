   
<!DOCTYPE html><html><head><meta charset="utf-8"><title>NetLab JVM Live</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#14123a,#050812 60%);color:#d8f3ff;font-family:Segoe UI,Arial,sans-serif}
h1{margin:0;padding:18px 24px;font-size:28px;letter-spacing:3px;background:linear-gradient(90deg,#00f0ff,#ff2bd6,#ffd000);-webkit-background-clip:text;color:transparent}
h1 small{font-size:13px;color:#7fa;-webkit-text-fill-color:#7fa;letter-spacing:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:0 24px}
.card{background:#0c1230cc;border:1px solid #1f3a8a;border-radius:14px;padding:12px;box-shadow:0 0 18px #00e5ff22}
.card b{display:block;font-size:24px;color:#00f0ff;text-shadow:0 0 10px #00f0ff}.card span{font-size:11px;color:#8ab;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;padding:12px 24px}
canvas{width:100%;height:170px;background:#080d24;border:1px solid #1f3a8a;border-radius:14px}
.main{display:grid;grid-template-columns:330px 1fr;gap:12px;padding:0 24px 24px}
.list button{display:block;width:100%;text-align:left;margin:0 0 6px;padding:9px 11px;background:#0c1230;color:#cfe;border:1px solid #243a8a;border-radius:10px;cursor:pointer;font-size:12px}
.list button:hover,.list button.on{background:#1b2a70;border-color:#00f0ff;box-shadow:0 0 12px #00f0ff55}
pre{margin:0;background:#04070f;border:1px solid #1f3a8a;border-radius:14px;padding:14px;height:560px;overflow:auto;color:#7dffb0;font-size:12.5px}
.btn{margin:0 24px 8px;padding:10px 18px;border:0;border-radius:10px;font-weight:700;color:#000;background:linear-gradient(90deg,#ff2bd6,#ffd000);cursor:pointer}
@media(max-width:800px){.main{grid-template-columns:1fr}}
</style></head><body>
<h1>NETLAB &#9889; JVM LIVE <small id="ver"></small></h1>
<button class="btn" onclick="fetch('/api/stress')">&#128165; STRESS THE JVM (3s CPU + 80MB heap)</button>
<div class="cards" id="cards"></div>
<div class="grid"><canvas id="c1" width="600" height="300"></canvas><canvas id="c2" width="600" height="300"></canvas><canvas id="c3" width="600" height="300"></canvas><canvas id="c4" width="600" height="300"></canvas></div>
<div class="main"><div class="list" id="list"></div><pre id="out">Click a module on the left to see its real output.</pre></div>
<script>
var H=[],C=[],T=[];
function line(id,arr,col,max,label,keep,n){var c=document.getElementById(id),x=c.getContext('2d'),w=c.width,h=c.height;if(!keep){x.clearRect(0,0,w,h);x.strokeStyle='#16275a';for(var i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke();}}
x.shadowColor=col;x.shadowBlur=14;x.strokeStyle=col;x.lineWidth=3;x.beginPath();arr.forEach(function(v,i){var px=i*w/(n-1),py=h-6-(v/max)*(h-30);i?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();x.shadowBlur=0;x.fillStyle=col;x.font='bold 15px monospace';x.fillText(label,10,keep?38:20);}
function push(a,v){a.push(v);if(a.length>60)a.shift();}
function card(l,v){return '<div class="card"><span>'+l+'</span><b>'+v+'</b></div>';}
function tick(){fetch('/api/jvm').then(function(r){return r.json()}).then(function(j){
push(H,j.heapUsed/1048576);push(C,j.cpu);push(T,j.threads);
document.getElementById('ver').textContent=j.vm+' / Java '+j.java;
document.getElementById('cards').innerHTML=card('Heap used',(j.heapUsed/1048576).toFixed(0)+' MB')+card('Heap max',(j.heapMax/1048576).toFixed(0)+' MB')+card('Non-heap',(j.nonHeap/1048576).toFixed(0)+' MB')+card('Threads',j.threads+' (peak '+j.peak+')')+card('Process CPU',j.cpu.toFixed(1)+'%')+card('GC runs',j.gcCount+' / '+j.gcTime+'ms')+card('Classes',j.classes)+card('Cores',j.cores)+card('Uptime',(j.uptime/1000).toFixed(0)+' s');
line('c1',H,'#00f0ff',Math.max(50,Math.max.apply(null,H)*1.2),'HEAP USED (MB)',false,60);line('c2',C,'#ff2bd6',100,'PROCESS CPU (%)',false,60);line('c3',T,'#ffd000',Math.max(10,Math.max.apply(null,T)*1.3),'LIVE THREADS',false,60);});}
function cw(){fetch('/api/cwnd').then(function(r){return r.json()}).then(function(j){var m=Math.max.apply(null,j.tahoe.concat(j.reno))*1.1;line('c4',j.tahoe,'#ff7a00',m,'TCP TAHOE cwnd',false,j.tahoe.length);line('c4',j.reno,'#39ff14',m,'TCP RENO cwnd',true,j.reno.length);});}
fetch('/api/modules').then(function(r){return r.json()}).then(function(a){var l=document.getElementById('list');a.forEach(function(n){var b=document.createElement('button');b.textContent=n;b.onclick=function(){[].forEach.call(l.children,function(x){x.className=''});b.className='on';fetch('/api/module?name='+encodeURIComponent(n)).then(function(r){return r.text()}).then(function(t){document.getElementById('out').textContent=t;});};l.appendChild(b);});l.children[0].click();});
setInterval(tick,1000);tick();cw();
</script></body></html>
""";
}
